name: Auto Merge

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_run doesn't directly give us the PR number, so look it up from the head branch
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          PR=$(gh pr list --repo "${{ github.repository }}" --head "$HEAD_BRANCH" --base main --json number --jq '.[0].number')
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Squash merge PR
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch

      - name: Close linked issues
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bash, not the default bash -e, so a failed lookup fails the step via pipefail
        shell: bash
        run: |
          # GitHub doesn't apply closing keywords to merges made by github-actions, so close them here.
          # GITHUB_TOKEN can't close issues in other repos, so only this repo's are closed.
          PR="${{ steps.pr.outputs.number }}"
          gh pr view "$PR" --repo "${{ github.repository }}" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[] | select(.repository.owner.login + "/" + .repository.name == "${{ github.repository }}") | .url' |
            while read -r ISSUE; do
              gh issue close "$ISSUE" --comment "Closed by ${{ github.repository }}#$PR."
            done
