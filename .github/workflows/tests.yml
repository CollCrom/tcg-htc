# auto-merge.yml triggers on this workflow by name; keep it "Tests".
name: Tests

on:
  pull_request:
    branches: [main]
    # ready_for_review lets auto-merge.yml merge a draft once it's marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

# Explicit bash runs steps with -eo pipefail; the implicit default is bash -e.
defaults:
  run:
    shell: bash

jobs:
  # Workflow changes can't run on their own PR (auto-merge.yml runs from main), so lint them here.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      # scripts/lint-workflows.sh pins the actionlint version, so local runs and CI share it.
      - name: Actionlint
        run: pnpm lint:workflows

      - name: Every workflow sets defaults.run.shell to bash
        run: |
          status=0
          for f in .github/workflows/*.yml; do
            if [ "$(yq '.defaults.run.shell' "$f")" != bash ]; then
              echo "::error file=$f::set top-level defaults.run.shell: bash so run steps get pipefail"
              status=1
            fi
          done
          exit "$status"


  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Names avoid the glossary's Avoid words
        run: pnpm check:glossary

      - name: Smoke
        run: pnpm smoke

      - name: Upstream tests
        run: pnpm test:upstream

      - name: Tests
        run: pnpm test
